<!DOCTYPE html>
<html>
<head>
  <title>Authorizing...</title>
  <script>
    // Extract code from URL and store it
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (code) {
      // Redirect back to root with code in URL
      window.location.href = '/?code=' + encodeURIComponent(code);
    } else if (error) {
      console.error('OAuth error:', error);
      // Redirect back to root after a short delay
      setTimeout(() => {
        window.location.href = '/';
      }, 2000);
    }
  </script>
</head>
<body>
  <p>Authorizing your Google account... Please wait.</p>
</body>
</html>
