name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: 502311578585-bf1sr1njctupjn5k8lv7mh829h78rm86.apps.googleusercontent.com
          VITE_CALENDAR_SERVER_URL: https://crm-production-991b.up.railway.app
          VITE_FIREBASE_API_KEY: AIzaSyBqGOXZdZ_5Xc0kshufOXwZHbW2vPmOuTs
          VITE_FIREBASE_AUTH_DOMAIN: wholesale-7a3c2.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://wholesale-7a3c2-default-rtdb.firebaseio.com
          VITE_FIREBASE_PROJECT_ID: wholesale-7a3c2
          VITE_FIREBASE_STORAGE_BUCKET: wholesale-7a3c2.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "502311578585"
          VITE_FIREBASE_APP_ID: 1:502311578585:web:f2a8fc27d9902113c347c8
          VITE_FIREBASE_MEASUREMENT_ID: G-XP25PL56QC
          VITE_RENTCAST_API_KEY: 12679489237e4520a5cd7c5e53c8d436
          VITE_BREVO_API_KEY: ${{ secrets.VITE_BREVO_API_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
